[project]
name = "ledger-harness"
version = "0.1.0"
description = "A Postgres-backed test bench that scores what an AI agent posts to a ledger."
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary]>=3.2",
    "anthropic>=1.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
